services:
  postgres-userservice:
    container_name: postgres-userservice
    image: postgres:18.6-alpine3.23
    volumes:
      - userservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
  userservice-merezh:
    container_name: userservice-merezh
    image: nisujko/userservice-merezh:1.0
    restart: always
    networks:
      - dbnet
    depends_on:
      - postgres-userservice

networks:
    dbnet:
      driver: bridge
volumes:
  userservice-data:
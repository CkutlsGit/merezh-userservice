services:
  postgres-userservice:
    container_name: postgres-userservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=userservice-merezh
    volumes:
      - userservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
  userservice-merezh:
    container_name: userservice-merezh
    build: .
    ports:
      - "8080:8080"
    restart: always
    networks:
      - dbnet
    depends_on:
      - postgres-userservice

networks:
    dbnet:
      driver: bridge
volumes:
  userservice-data: